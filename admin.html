<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — DAM Coffee</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- Шапка с глассморфизмом -->
        <header class="admin-header glass">
            <div class="header-content">
                <div>Admin панель</h1>
                    <p class="subtitle">Управление каталогом</p>
                </div>
                <button class="btn btn-glass" onclick="window.location.href='index.html'">
                    ← В магазин
                </button>
            </div>
        </header>

        <div id="alertContainer"></div>

        <!-- Статистика -->
        <div class="section glass">
            <h2 class="section-title"> Статистика</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Товаров</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statAvgPrice">0 ₴</div>
                    <div class="stat-label">Средняя цена</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statRevenue">0 </div>
                    <div class="stat-label">Общая стоимость</div>
                </div>
            </div>
        </div>

        <!-- Импорт прайса -->
        <div class="section glass">
            <h2 class="section-title">📄 Импорт прайс-листа</h2>
            
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📁</div>
                <div class="upload-text">
                    <strong>Перетащите файл сюда</strong>
                    <span>или нажмите для выбора (.txt, .csv)</span>
                </div>
                <input type="file" id="fileInput" accept=".txt,.csv" hidden>
            </div>

            <div class="input-group">
                <label>Или вставьте текст вручную:</label>
                <textarea id="priceText" placeholder="Скопируйте текст из PDF и вставьте сюда..."></textarea>
            </div>

            <button class="btn btn-primary btn-large" onclick="parsePriceList()">
                ✨ Распарсить через ИИ
            </button>
        </div>

        <!-- Список товаров -->
        <div class="section glass">
            <div class="section-header">
                <h2 class="section-title">🛒 Товары</h2>
                <button class="btn btn-accent btn-sm" onclick="openAddModal()">
                    + Добавить
                </button>
            </div>
            
            <div class="product-list-admin" id="currentProducts"></div>
            
            <button class="btn btn-danger btn-large" onclick="clearStore()">
                🗑️ Очистить весь магазин
            </button>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="productModal" class="modal-overlay hidden">
        <div class="modal-content glass">
            <div class="modal-header">
                <h3 id="modalTitle">Добавить товар</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            
            <div class="modal-body">
                <form id="productForm" onsubmit="saveProductFromModal(event)">
                    <input type="hidden" id="editProductId">
                    
                    <!-- Загрузка изображения -->
                    <div class="image-upload-section">
                        <div class="image-preview" id="imagePreview">
                            <div class="upload-placeholder">
                                <div class="upload-icon-large">🖼️</div>
                                <div>Нажмите для загрузки фото</div>
                            </div>
                        </div>
                        <input type="file" id="mImageFile" accept="image/*" hidden onchange="handleImageUpload(event)">
                        <input type="hidden" id="mImageBase64">
                        <button type="button" class="btn btn-glass btn-sm" onclick="document.getElementById('mImageFile').click()">
                             Загрузить фото
                        </button>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Название *</label>
                            <input type="text" id="mTitle" required placeholder="Ethiopia Daye Bensa">
                        </div>
                        <div class="form-group">
                            <label>Страна *</label>
                            <input type="text" id="mOrigin" required placeholder="Эфиопия">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Цена (₴) *</label>
                            <input type="number" id="mPrice" required placeholder="345">
                        </div>
                        <div class="form-group">
                            <label>Вес</label>
                            <input type="text" id="mWeight" value="250 г">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="mDescription" rows="2" placeholder="Краткое описание..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Вкусовые ноты</label>
                        <input type="text" id="mFlavor" placeholder="Черный чай, курага, лимон">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Обработка</label>
                            <select id="mProcessing">
                                <option value="Натуральная">Натуральная</option>
                                <option value="Мытая">Мытая</option>
                                <option value="Анаэробная">Анаэробная</option>
                                <option value="Термошок">Термошок</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Обжарка</label>
                            <select id="mRoast">
                                <option value="Светлая">Светлая</option>
                                <option value="Средняя">Средняя</option>
                                <option value="Темная">Темная</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Вкусовой профиль (1-5)</label>
                        <div class="taste-inputs">
                            <div>
                                <label>Кислотность</label>
                                <input type="number" id="mAcidity" min="1" max="5" value="3">
                            </div>
                            <div>
                                <label>Сладость</label>
                                <input type="number" id="mSweetness" min="1" max="5" value="3">
                            </div>
                            <div>
                                <label>Плотность</label>
                                <input type="number" id="mBody" min="1" max="5" value="3">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Методы заваривания</label>
                        <div class="checkbox-grid">
                            <label><input type="checkbox" value="espresso"> Эспрессо</label>
                            <label><input type="checkbox" value="filter"> Фильтр</label>
                            <label><input type="checkbox" value="v60"> V60</label>
                            <label><input type="checkbox" value="aeropress"> AeroPress</label>
                            <label><input type="checkbox" value="frenchpress"> Френч-пресс</label>
                            <label><input type="checkbox" value="moka"> Мока</label>
                            <label><input type="checkbox" value="turka"> Турка</label>
                            <label><input type="checkbox" value="coldbrew"> Cold Brew</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Теги</label>
                        <input type="text" id="mTags" placeholder="specialty, new, decaf">
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-glass" onclick="closeModal()">Отмена</button>
                        <button type="submit" class="btn btn-primary">💾 Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
