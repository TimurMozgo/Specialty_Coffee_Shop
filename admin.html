<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — DAM Coffee</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div>
                <h1>☕ Админ-панель DAM Coffee</h1>
                <p class="subtitle">Управление каталогом магазина</p>
            </div>
            <button class="btn btn-outline" onclick="window.location.href='index.html'" style="margin-top: 16px; width: 100%; max-width: 250px;">
                ← Вернуться в магазин
            </button>
        </header>

        <div id="alertContainer"></div>

        <!-- Статистика -->
        <div class="section">
            <h2 class="section-title">📊 Текущее состояние</h2>
            <div class="stats-grid" id="currentStats">
                <div class="stat-card">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Товаров в магазине</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statAvgPrice">0 ₴</div>
                    <div class="stat-label">Средняя цена</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statCategories">0</div>
                    <div class="stat-label">Категорий</div>
                </div>
            </div>
        </div>

        <!-- Загрузка прайса -->
        <div class="section">
            <h2 class="section-title">📄 Загрузка прайс-листа</h2>
            
            <div class="input-group">
                <label>Способ 1: Вставить текст из PDF</label>
                <textarea id="priceText" placeholder="Скопируйте текст из PDF прайс-листа и вставьте сюда..."></textarea>
            </div>

            <div class="input-group">
                <label>Способ 2: Загрузить файл (.txt, .csv)</label>
                <input type="file" id="fileInput" accept=".txt,.csv,.json">
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="parsePriceList()">🔍 Распарсить прайс</button>
                <button class="btn btn-outline" onclick="clearAll()">🗑️ Очистить</button>
            </div>
        </div>

        <!-- Предпросмотр -->
        <div class="section hidden" id="previewSection">
            <h2 class="section-title">📦 Найдено товаров: <span id="productsCount">0</span></h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="previewTotal">0</div>
                    <div class="stat-label">Всего</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="previewAvgPrice">0 ₴</div>
                    <div class="stat-label">Средняя цена</div>
                </div>
            </div>

            <div class="product-list" id="productPreview"></div>

            <div class="button-group">
                <button class="btn btn-success" onclick="saveToStore()">💾 Сохранить в магазин</button>
                <button class="btn btn-outline" onclick="exportJSON()">📥 Экспорт JSON</button>
            </div>
        </div>

        <!-- Управление товарами -->
        <div class="section">
            <h2 class="section-title">🛒 Товары в магазине</h2>
            <div class="product-list" id="currentProducts"></div>
            <button class="btn btn-danger" onclick="clearStore()" style="margin-top: 16px;">🗑️ Очистить магазин</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
